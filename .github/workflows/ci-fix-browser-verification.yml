name: NETGRID CI fix browser verification

on:
  push:
    branches:
      - codex/verify-ci-fixes-8e29ddd

concurrency:
  group: netgrid-ci-fix-browser-verification
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Firefox is the configured UI project; multiplayer explicitly launches Chromium.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps firefox chromium

      - name: Run E2E suite
        run: pnpm e2e
