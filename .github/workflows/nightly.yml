name: NETGRID Nightly Verification

on:
  schedule:
    # 01:37 UTC = 03:37 CEST / 02:37 CET. An off-hour minute reduces scheduler congestion.
    - cron: "37 1 * * *"
  workflow_dispatch:

concurrency:
  group: netgrid-nightly
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-verification:
    name: Full verification
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: AI architecture checks
        run: pnpm check:ai

      - name: Engine source structure
        run: pnpm check:engine-source-structure

      - name: Card-function abstraction
        run: pnpm check:card-function-abstraction

      - name: Engine CardImplementation architecture
        run: pnpm check:engine-cardimplementation-architecture-target

      - name: Engine credit-gain boundary
        run: pnpm check:engine-credit-gain-boundary

      - name: Package boundaries
        run: pnpm check:package-boundaries

      - name: Icebreaker run semantics
        run: pnpm check:icebreaker-run-semantics

      - name: Proteus AI readiness
        run: pnpm check:proteus-ai-readiness

      - name: Contract tests
        run: pnpm test:contracts

      - name: Full test suite
        run: pnpm test

      - name: Build
        run: pnpm build

  ai-shards:
    name: AI shards
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run AI shards
        run: pnpm test:ai:shards

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E suite
        run: pnpm e2e
