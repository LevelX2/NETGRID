name: NETGRID CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: netgrid-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-and-contracts:
    name: Static checks and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: AI architecture checks
        run: pnpm check:ai

      - name: Engine source structure
        run: pnpm check:engine-source-structure

      - name: Package boundaries
        run: pnpm check:package-boundaries

      - name: Icebreaker run semantics
        run: pnpm check:icebreaker-run-semantics

      - name: Contract tests
        run: pnpm test:contracts

  package-tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: ai
            name: AI tests
            command: pnpm --filter @netgrid/ai test
          - suite: workspace
            name: Workspace tests (without AI)
            command: pnpm -r --filter '!@netgrid/ai' --filter '!netgrid-app' --no-bail --if-present test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: ${{ matrix.command }}

      - name: Test discovery and specs
        if: ${{ !cancelled() && matrix.suite == 'workspace' && steps.install.outcome == 'success' }}
        run: pnpm check:test-discovery && pnpm exec vitest run tests/specs --passWithNoTests

  # Preserve the existing overall check name: it may only pass when both
  # independent test groups succeeded, even if one failed or was cancelled.
  tests:
    name: Test suite
    if: ${{ always() }}
    needs: package-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test group to pass
        run: test "${{ needs.package-tests.result }}" = "success"
